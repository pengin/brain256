<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>brain-registry</title>
<style>
  body { font-family: sans-serif; margin: 2rem; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: left; vertical-align: top; }
  th { background: #f0f0f0; }
  .latest { font-weight: bold; }
  a { color: #06c; text-decoration: none; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<h1>brain-registry</h1>
<table id="bundles">
  <thead><tr><th>Name</th><th>Versions</th><th>Latest</th></tr></thead>
  <tbody></tbody>
</table>
<p id="empty" style="display:none">No bundles registered yet.</p>
<script>
fetch('/api/bundles')
  .then(function (res) { return res.json(); })
  .then(function (data) {
    var names = Object.keys(data).sort();
    var tbody = document.querySelector('#bundles tbody');
    if (names.length === 0) {
      document.getElementById('bundles').style.display = 'none';
      document.getElementById('empty').style.display = 'block';
      return;
    }
    names.forEach(function (name) {
      var info = data[name];
      var row = document.createElement('tr');

      var nameCell = document.createElement('td');
      nameCell.textContent = name;
      row.appendChild(nameCell);

      var versionsCell = document.createElement('td');
      (info.versions || []).forEach(function (v, i) {
        if (i > 0) versionsCell.appendChild(document.createTextNode(', '));
        var link = document.createElement('a');
        link.href = '/bundles/' + encodeURIComponent(name) + '/' + encodeURIComponent(v);
        link.textContent = v;
        versionsCell.appendChild(link);
      });
      row.appendChild(versionsCell);

      var latestCell = document.createElement('td');
      latestCell.className = 'latest';
      latestCell.textContent = info.latest;
      row.appendChild(latestCell);

      tbody.appendChild(row);
    });
  })
  .catch(function (err) {
    document.body.appendChild(document.createTextNode('Failed to load bundle list: ' + err));
  });
</script>
</body>
</html>
