# registry/ の Go テスト。
name: registry

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: go test
        working-directory: registry
        run: go test ./...

      - name: go vet
        working-directory: registry
        run: go vet ./...
