# scripts/patch_dtb.sh が読み込む。DTB へ追加するプロパティの宣言。
#
# 共通の imx28-brain.dtsi は usb0 を dr_mode = "host" に固定しており、UDC が
# 登録されない。ci_hdrc は DT に usb-role-switch があるときだけロールスイッチを
# 登録する (drivers/usb/chipidea/core.c:796)。この 2 つを足すことで、実機の
# /usr/sbin/brainwrt-usb-mode が /sys/class/usb_role からロールを切り替えられる。
DTB_PATCH_NODE=/ahb@80080000/usb@80080000
DTB_PATCH_STRING_PROPS="dr_mode=otg"
DTB_PATCH_BOOL_PROPS="usb-role-switch"
